name: Devcontainer-Image

on:
  push:
    branches:
      - master
    paths:
      - docker/devcontainer/**
      - pom.xml
      - core/pom.xml
      - web/pom.xml
      - ws/pom.xml
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Devcontainer-Image bauen und veröffentlichen
        run: |
          npm install -g @devcontainers/cli
          devcontainer build \
            --workspace-folder . \
            --config docker/devcontainer/devcontainer.json \
            --image-name ghcr.io/feststelltaste/openclinica-demo-devcontainer:latest \
            --push
