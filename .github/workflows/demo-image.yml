name: Demo-Image

on:
  push:
    tags:
      - "demo-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: WAR bauen
        run: mvn -B -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/feststelltaste/openclinica-demo:${{ github.ref_name }}

      - name: Demo-Daten erzeugen
        run: bash docker/test/reset-demo-data.sh --yes

      - name: Datenbank sichern
        run: bash docker/test/dump-demo-data.sh docker/db/demo-data.sql.gz

      - uses: docker/build-push-action@v6
        with:
          context: docker/db
          push: true
          tags: ghcr.io/feststelltaste/openclinica-demo-db:${{ github.ref_name }}
