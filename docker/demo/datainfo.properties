# Local test installation only. Do not reuse these credentials in production.
dbType=postgres
dbUser=clinica
dbPass=clinica
db=openclinica
dbPort=5432
dbHost=database

filePath=/usr/local/tomcat/openclinica.data/
userAccountNotification=screen
adminEmail=admin@example.invalid

mailHost=localhost
mailPort=25
mailProtocol=smtp
mailUsername=
mailPassword=
mailSmtpAuth=false
mailSmtpStarttls.enable=false
mailSmtpsAuth=false
mailSmtpsStarttls.enable=false
mailSmtpConnectionTimeout=100
mailErrorMsg=admin@example.invalid

passwordEncryptionSalt=
change_passwd_required=0
passwd_expiration_time=0
sysURL=http://127.0.0.1:8080/OpenClinica/MainMenu
maxInactiveInterval=3600

log.dir=/usr/local/tomcat/logs/openclinica
logLocation=local
logLevel=info
syslog.host=localhost
syslog.port=514

org.quartz.jobStore.misfireThreshold=18000000
org.quartz.threadPool.threadCount=1
org.quartz.threadPool.threadPriority=5
ccts.waitBeforeCommit=6000
extract.number=99

collectStats=false
usage.stats.host=localhost
usage.stats.port=514
OpenClinica.version=3.18-SNAPSHOT
designerURL=https://designer13.openclinica.com/

# LDAP is disabled, but the legacy Spring context still requires every
# placeholder to be present while it creates the authentication beans.
ldap.enabled=false
ldap.host=ldap://localhost:389
ldap.userDn=
ldap.password=
ldap.loginQuery=(uid={0})
ldap.passwordRecoveryURL=http://127.0.0.1:8080/OpenClinica/MainMenu
ldap.userSearch.baseDn=dc=example,dc=invalid
ldap.userSearch.query=(uid=*{0}*)
ldap.userData.distinguishedName=distinguishedName
ldap.userData.username=uid
ldap.userData.firstName=givenName
ldap.userData.lastName=sn
ldap.userData.email=mail
ldap.userData.organization=o
