name: openclinica-demo

services:
  database:
    image: postgres:11
    environment:
      POSTGRES_DB: openclinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d openclinica"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - openclinica-test-db:/var/lib/postgresql/data

  openclinica:
    image: tomcat:9.0-jdk8-temurin-jammy
    depends_on:
      database:
        condition: service_healthy
    environment:
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1536m
        -Djava.awt.headless=true
        -Dfile.encoding=UTF-8
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/OpenClinica/pages/login/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      - ../web/target/OpenClinica-web-3.18-SNAPSHOT.war:/usr/local/tomcat/webapps/OpenClinica.war:ro
      - ./demo/datainfo.properties:/usr/local/tomcat/openclinica.config/datainfo.properties:ro
      - openclinica-test-files:/usr/local/tomcat/openclinica.data

volumes:
  openclinica-test-db:
  openclinica-test-files:
