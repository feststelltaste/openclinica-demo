<title>Zone Treemap</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1f23; --muted:#6b7078; --line:#d9dbe0; --panel:#fff;
          --red:#d1495b; --yellow:#edae49; --green:#66a182; --none:#c9ccd1; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#16181c; --fg:#e7e9ec; --muted:#9aa0a8; --line:#33373d; --panel:#1f2227;
            --red:#e0687a; --yellow:#f0bd63; --green:#7bb698; --none:#4a4f57; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#16181c; --fg:#e7e9ec; --muted:#9aa0a8; --line:#33373d; --panel:#1f2227;
            --red:#e0687a; --yellow:#f0bd63; --green:#7bb698; --none:#4a4f57; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { padding:14px 16px 8px; min-width:0; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  label { color:var(--muted); font-size:13px; }
  select { font:inherit; padding:4px 6px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  #crumbs { padding:0 16px 8px; font-size:13px; color:var(--muted); }
  #crumbs a { color:var(--fg); cursor:pointer; text-decoration:underline; }
  #chart { margin:0 16px 16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); position:relative; overflow:hidden; }
  svg text { pointer-events:none; }
  .dir rect { fill:none; stroke:var(--line); }
  .leaf rect { stroke:var(--bg); stroke-width:1; cursor:default; }
  .dirhead { cursor:pointer; fill:var(--fg); font-size:11px; font-weight:600; }
  .leaflabel { font-size:10px; fill:#111; }
  #tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px;
         padding:8px 10px; font-size:12px; max-width:380px; box-shadow:0 2px 10px rgba(0,0,0,.18); display:none; z-index:5; }
  #tip b { display:block; word-break:break-all; margin-bottom:4px; }
  #tip .z { display:inline-block; padding:0 6px; border-radius:8px; color:#111; font-size:11px; margin:1px 3px 1px 0; }
  .hint { padding:0 16px 14px; color:var(--muted); font-size:12px; }
</style>
<header>
  <h1>Zone Treemap</h1>
  <label>Lens <select id="lens"></select></label>
  <label>Area <select id="size"><option value="loc">Lines (LOC)</option><option value="n">File count</option></select></label>
  <div class="legend" id="legend"></div>
</header>
<div id="crumbs"></div>
<div id="chart"></div>
<div class="hint">Click a folder header to zoom in, breadcrumb to go back. Colour = worst zone of all concepts whose <em>core</em> (path match) contains the file. Grey = not assigned to any concept. As of: __META__</div>
<div id="tip"></div>
__D3TAG__
<script>
const DATA = __DATA__;
const COLORS = {red:'var(--red)', yellow:'var(--yellow)', green:'var(--green)', none:'var(--none)'};
const RANK = {red:3, yellow:2, green:1};
const NAMES = {red:'Red', yellow:'Yellow', green:'Green', none:'no zone'};

// Tree from paths
function build() {
  const root = {name:'', children:[], path:''};
  for (const [path, loc, cs] of DATA.files) {
    let n = root; const parts = path.split('/');
    parts.forEach((p, i) => {
      let c = n.children.find(x => x.name === p);
      if (!c) { c = {name:p, path: parts.slice(0,i+1).join('/')}; if (i < parts.length-1) c.children = []; n.children.push(c); }
      n = c;
    });
    n.loc = loc; n.cs = cs;
  }
  return root;
}
// Collapse chains of single subfolders (core/src/main/java/org/akaza/...)
function compress(n) {
  while (n.children && n.children.length === 1 && n.children[0].children) {
    const c = n.children[0]; n.name = n.name ? n.name + '/' + c.name : c.name; n.path = c.path; n.children = c.children;
  }
  (n.children || []).forEach(compress); return n;
}
const tree = compress(build());

const lensSel = d3.select('#lens');
lensSel.append('option').attr('value','all').text('All lenses (worst zone)');
for (const [k,t] of Object.entries(DATA.lenses)) lensSel.append('option').attr('value',k).text(t);
function zoneOf(cs, lens) {
  let best = 'none';
  for (const i of cs) { const c = DATA.concepts[i]; if (c.zone && (lens==='all' || c.lens===lens) && (RANK[c.zone]||0) > (RANK[best]||0)) best = c.zone; }
  return best;
}

let focus = tree;
const wrap = document.getElementById('chart');
function render() {
  const lens = lensSel.property('value'), sizeBy = d3.select('#size').property('value');
  const W = Math.max(320, wrap.clientWidth), H = Math.max(520, window.innerHeight - 200);
  const root = d3.hierarchy(focus, d => d.children)
      .sum(d => d.children ? 0 : (sizeBy==='n' ? 1 : Math.max(1, d.loc)))
      .sort((a,b) => b.value - a.value);
  d3.treemap().size([W,H]).paddingInner(1).paddingOuter(2).paddingTop(d => d.depth===0 ? 2 : 15).round(true)(root);
  root.leaves().forEach(l => l.zone = zoneOf(l.data.cs || [], lens));
  wrap.innerHTML = '';
  const svg = d3.select(wrap).append('svg').attr('width',W).attr('height',H);
  const dirs = root.descendants().filter(d => d.children && d.depth>0 && d.x1-d.x0>30 && d.y1-d.y0>18);
  const g1 = svg.selectAll('g.dir').data(dirs).join('g').attr('class','dir');
  g1.append('rect').attr('x',d=>d.x0).attr('y',d=>d.y0).attr('width',d=>d.x1-d.x0).attr('height',d=>d.y1-d.y0);
  g1.append('text').attr('class','dirhead').attr('x',d=>d.x0+3).attr('y',d=>d.y0+11)
    .text(d => { const w = d.x1-d.x0; const s = d.data.name; return s.length*6.2 > w-6 ? s.slice(0, Math.max(0,Math.floor((w-6)/6.2)-1))+'…' : s; })
    .on('click', (e,d) => { focus = d.data; render(); });
  const lv = root.leaves();
  const g2 = svg.selectAll('g.leaf').data(lv).join('g').attr('class','leaf');
  g2.append('rect').attr('x',d=>d.x0).attr('y',d=>d.y0).attr('width',d=>Math.max(0,d.x1-d.x0)).attr('height',d=>Math.max(0,d.y1-d.y0))
    .attr('fill', d => COLORS[d.zone])
    .on('mousemove', (e,d) => tip(e,d)).on('mouseleave', () => document.getElementById('tip').style.display='none');
  g2.filter(d => d.x1-d.x0>60 && d.y1-d.y0>13).append('text').attr('class','leaflabel').attr('x',d=>d.x0+3).attr('y',d=>d.y0+10)
    .text(d => { const s=d.data.name.replace(/\.(java|jsp)$/,''); const w=d.x1-d.x0-6; return s.length*5.6>w ? s.slice(0,Math.max(0,Math.floor(w/5.6)-1))+'…' : s; });

  // Legend (totals in the current view)
  const sums = {red:0,yellow:0,green:0,none:0}; lv.forEach(l => sums[l.zone] += sizeBy==='n' ? 1 : l.data.loc);
  const tot = d3.sum(Object.values(sums)) || 1, unit = sizeBy==='n' ? 'files' : 'LOC';
  d3.select('#legend').html(Object.keys(sums).map(z => `<span><i class="sw" style="background:${COLORS[z]}"></i>${NAMES[z]} ${d3.format(',')(sums[z])} ${unit} (${Math.round(100*sums[z]/tot)} %)</span>`).join(''));
  // Breadcrumb
  const parts = []; let p = tree;
  const trail = [tree]; (function find(n){ if (n===focus) return true; for (const c of n.children||[]) { trail.push(c); if (find(c)) return true; trail.pop(); } return false; })(tree);
  d3.select('#crumbs').html(trail.map((n,i) => i===trail.length-1 ? `<b>${n.name||'Repo'}</b>` : `<a data-i="${i}">${n.name||'Repo'}</a>`).join(' / '))
    .selectAll('a').on('click', function() { focus = trail[+this.dataset.i]; render(); });
}
function tip(e, d) {
  const t = document.getElementById('tip'), lens = lensSel.property('value');
  const cs = (d.data.cs||[]).map(i => DATA.concepts[i]).filter(c => lens==='all' || c.lens===lens);
  t.innerHTML = `<b>${d.data.path}</b>${d.data.loc} LOC · Zone: ${NAMES[d.zone]}<br>` +
    (cs.length ? cs.map(c => `<span class="z" style="background:${COLORS[c.zone||'none']}">${c.title}</span>`).join('') : '<em>not assigned to any concept</em>');
  t.style.display='block'; t.style.left=Math.min(e.clientX+14, innerWidth-400)+'px'; t.style.top=(e.clientY+14)+'px';
}
lensSel.on('change', render); d3.select('#size').on('change', render);
addEventListener('resize', render); render();
</script>
